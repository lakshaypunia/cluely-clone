<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0b0b12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Pulse Remote</title>
<style>
  :root {
    --bg: #0b0b12;
    --card: rgba(255, 255, 255, 0.05);
    --card-hi: rgba(255, 255, 255, 0.09);
    --stroke: rgba(255, 255, 255, 0.08);
    --text: #f3f3f7;
    --muted: #9a9ab0;
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --good: #34d399;
    --warn: #fbbf24;
    --bad: #f87171;
    --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(120% 60% at 0% 0%, rgba(124, 92, 255, 0.28), transparent 60%),
      radial-gradient(90% 50% at 100% 10%, rgba(34, 211, 238, 0.18), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 32px);
  }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 42px; height: 42px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    box-shadow: 0 8px 24px rgba(124, 92, 255, 0.45);
  }
  .logo svg { width: 22px; height: 22px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.02em; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .conn {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--stroke);
    font-size: 12px; font-weight: 600; color: var(--muted);
  }
  .conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
  .conn.on i { background: var(--good); box-shadow: 0 0 10px var(--good); }
  .conn.on { color: var(--text); }

  /* Status chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip {
    font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--stroke); color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .chip.lit { color: var(--text); border-color: rgba(124, 92, 255, 0.5); background: rgba(124, 92, 255, 0.16); }
  .chip.rec { color: #fff; border-color: rgba(248, 113, 113, 0.6); background: rgba(248, 113, 113, 0.2); }
  .chip.rec::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); animation: pulse 1s infinite; }

  /* Section */
  .section-title {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); font-weight: 700; margin: 22px 4px 10px;
  }

  /* Big buttons */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn {
    position: relative; overflow: hidden;
    border: 1px solid var(--stroke); background: var(--card);
    color: var(--text); border-radius: var(--radius);
    padding: 18px 16px; min-height: 108px;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 10px;
    font: inherit; text-align: left; cursor: pointer;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .btn:active { transform: scale(0.96); background: var(--card-hi); }
  .btn .ic {
    width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center;
    background: rgba(255, 255, 255, 0.07);
  }
  .btn .ic svg { width: 22px; height: 22px; }
  .btn .label { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .btn .hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; font-weight: 500; }
  .btn.wide { grid-column: span 2; min-height: 92px; flex-direction: row; align-items: center; justify-content: flex-start; gap: 16px; }
  .btn.hero {
    background: linear-gradient(135deg, rgba(124, 92, 255, 0.9), rgba(34, 211, 238, 0.75));
    border-color: transparent; box-shadow: 0 14px 34px rgba(124, 92, 255, 0.35);
  }
  .btn.hero .ic { background: rgba(255, 255, 255, 0.2); }
  .btn.hero .hint { color: rgba(255, 255, 255, 0.8); }
  .btn.on { border-color: rgba(124, 92, 255, 0.65); background: rgba(124, 92, 255, 0.18); }
  .btn.recording { border-color: rgba(248, 113, 113, 0.7); background: rgba(248, 113, 113, 0.18); }
  .btn.recording .ic { background: var(--bad); animation: pulse 1.2s infinite; }
  .btn.danger .ic { background: rgba(248, 113, 113, 0.18); color: var(--bad); }
  .btn .badge {
    position: absolute; top: 12px; right: 12px; min-width: 24px; height: 24px; padding: 0 7px;
    border-radius: 999px; background: var(--accent-2); color: #04151a;
    font-size: 12px; font-weight: 800; display: none; align-items: center; justify-content: center;
  }
  .btn .badge.show { display: flex; }
  .btn .flash {
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.35), transparent 60%);
    opacity: 0; transition: opacity 0.4s ease;
  }
  .btn.flashing .flash { opacity: 1; transition: none; }
  .btn.hold-fill::after {
    content: ''; position: absolute; left: 0; bottom: 0; height: 4px; background: var(--bad);
    width: 0; animation: hold 0.9s linear forwards;
  }

  /* Composer */
  .composer {
    border: 1px solid var(--stroke); background: var(--card); border-radius: var(--radius);
    padding: 12px; display: flex; gap: 10px; align-items: flex-end;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .composer textarea {
    flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 16px; line-height: 1.4; padding: 10px 6px; min-height: 48px; max-height: 160px;
    user-select: text; -webkit-user-select: text;
  }
  .composer textarea::placeholder { color: var(--muted); }
  .send {
    width: 56px; height: 56px; border-radius: 18px; border: 0; cursor: pointer; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    display: grid; place-items: center; transition: transform 0.12s ease, opacity 0.2s;
  }
  .send:active { transform: scale(0.92); }
  .send:disabled { opacity: 0.4; }
  .send svg { width: 22px; height: 22px; }

  /* D-pad */
  .pad-row { display: grid; grid-template-columns: 1fr 1.1fr; gap: 12px; align-items: stretch; }
  .dpad {
    border: 1px solid var(--stroke); background: var(--card); border-radius: var(--radius);
    padding: 12px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    gap: 6px; aspect-ratio: 1;
  }
  .dpad button {
    border: 0; border-radius: 14px; background: rgba(255, 255, 255, 0.07); color: var(--text);
    display: grid; place-items: center; cursor: pointer; transition: transform 0.1s, background 0.2s;
  }
  .dpad button:active { transform: scale(0.9); background: rgba(124, 92, 255, 0.4); }
  .dpad button svg { width: 22px; height: 22px; }
  .dpad .center { background: transparent; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; }
  .stack { display: grid; gap: 12px; }
  .stack .btn { min-height: 0; flex-direction: row; align-items: center; justify-content: flex-start; gap: 12px; padding: 14px; }
  .stack .btn .ic { width: 38px; height: 38px; }

  /* Reply card */
  .reply {
    border: 1px solid var(--stroke); background: var(--card); border-radius: var(--radius);
    padding: 16px 18px; font-size: 14.5px; line-height: 1.55; color: #dedeea;
    white-space: pre-wrap; word-wrap: break-word; max-height: 46vh; overflow-y: auto;
    user-select: text; -webkit-user-select: text;
  }
  .reply.empty { color: var(--muted); text-align: center; font-size: 13px; }
  .reply.err { border-color: rgba(248, 113, 113, 0.5); }
  .cursor { display: inline-block; width: 8px; height: 16px; background: var(--accent-2); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(2) infinite; }

  /* Token gate */
  .gate {
    display: none; margin-top: 40px; text-align: center; padding: 28px 20px;
    border: 1px solid var(--stroke); background: var(--card); border-radius: var(--radius);
  }
  .gate p { color: var(--muted); font-size: 14px; line-height: 1.5; }
  .gate input {
    width: 100%; margin: 14px 0; padding: 16px; border-radius: 16px; border: 1px solid var(--stroke);
    background: rgba(0, 0, 0, 0.3); color: var(--text); font-size: 16px; text-align: center;
    user-select: text; -webkit-user-select: text;
  }
  .gate button {
    width: 100%; padding: 16px; border-radius: 16px; border: 0; font-size: 16px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
  }
  body.locked .app { display: none; }
  body.locked .gate { display: block; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 22px);
    transform: translate(-50%, 30px); opacity: 0;
    padding: 12px 18px; border-radius: 999px; font-size: 14px; font-weight: 600;
    background: rgba(20, 20, 30, 0.92); border: 1px solid var(--stroke);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    transition: all 0.25s ease; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { border-color: rgba(248, 113, 113, 0.6); color: #fecaca; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  @keyframes blink { to { opacity: 0; } }
  @keyframes hold { to { width: 100%; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
      </div>
      <div>
        <h1>Pulse Remote</h1>
        <div class="sub" id="sub">Control your desktop overlay</div>
      </div>
    </div>
    <div class="conn" id="conn"><i></i><span>Offline</span></div>
  </header>

  <div class="gate">
    <h2 style="margin:0 0 6px">Enter access token</h2>
    <p>Open the link printed in the app's console (it ends with <b>?t=…</b>), or paste the token here.</p>
    <input id="tokenInput" placeholder="Token" autocomplete="off" autocapitalize="off" />
    <button id="tokenSave">Connect</button>
  </div>

  <div class="app">
    <div class="chips" id="chips"></div>

    <div class="section-title">Ask</div>
    <div class="grid">
      <button class="btn wide hero" data-cmd="quick-send">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/><path d="M19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/></svg></div>
        <div><div class="label">Capture &amp; Ask</div><div class="hint">Screenshot + "What's on my screen?"</div></div>
      </button>
      <button class="btn" data-cmd="screenshot">
        <span class="badge" id="shotBadge">0</span>
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
        <div><div class="label">Screenshot</div><div class="hint">Add to queue</div></div>
      </button>
      <button class="btn" data-cmd="send" id="sendQueuedBtn">
        <div class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></div>
        <div><div class="label">Send</div><div class="hint">Typed text + queued shots</div></div>
      </button>
      <button class="btn" data-cmd="mic-toggle" id="micBtn">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg></div>
        <div><div class="label" id="micLabel">Dictate</div><div class="hint">PC microphone</div></div>
      </button>
      <button class="btn" data-cmd="clear-screenshots">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9l6 6M15 9l-6 6"/></svg></div>
        <div><div class="label">Clear shots</div><div class="hint">Empty the queue</div></div>
      </button>
    </div>

    <div class="section-title">Type a message</div>
    <div class="composer">
      <textarea id="msg" rows="1" placeholder="Ask anything… (queued screenshots are attached)"></textarea>
      <button class="send" id="msgSend" disabled aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>

    <div class="section-title">Latest reply</div>
    <div class="reply empty" id="reply">No replies yet — tap Capture &amp; Ask.</div>
    <div class="grid" style="margin-top:12px">
      <button class="btn wide" data-cmd="scroll-up" style="grid-column:span 1;min-height:64px">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></div>
        <div class="label">Scroll up</div>
      </button>
      <button class="btn wide" data-cmd="scroll-down" style="grid-column:span 1;min-height:64px">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
        <div class="label">Scroll down</div>
      </button>
    </div>

    <div class="section-title">Overlay window</div>
    <div class="grid">
      <button class="btn" data-cmd="toggle-visibility" id="visBtn">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div>
        <div><div class="label" id="visLabel">Hide</div><div class="hint">Show / hide overlay</div></div>
      </button>
      <button class="btn" data-cmd="toggle-interactive" id="intBtn">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="M13 13l6 6"/></svg></div>
        <div><div class="label" id="intLabel">Click-through</div><div class="hint">Toggle mouse passthrough</div></div>
      </button>
      <button class="btn" data-cmd="toggle-minimize" id="minBtn">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M4 12h2M18 12h2M12 4v2M12 18v2"/></svg></div>
        <div><div class="label" id="minLabel">Minimize</div><div class="hint">Collapse to a dot</div></div>
      </button>
      <button class="btn" data-cmd="toggle-fullsize" id="fullBtn">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></div>
        <div><div class="label" id="fullLabel">Full size</div><div class="hint">Toggle large panel</div></div>
      </button>
    </div>

    <div class="section-title">Move &amp; more</div>
    <div class="pad-row">
      <div class="dpad">
        <span></span>
        <button data-cmd="move-up" aria-label="Move up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
        <span></span>
        <button data-cmd="move-left" aria-label="Move left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <span class="center" style="display:grid;place-items:center">MOVE</span>
        <button data-cmd="move-right" aria-label="Move right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        <span></span>
        <button data-cmd="move-down" aria-label="Move down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <span></span>
      </div>
      <div class="stack">
        <button class="btn" data-cmd="clear-input">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><path d="M18 9l-6 6M12 9l6 6"/></svg></div>
          <div class="label">Clear input</div>
        </button>
        <button class="btn danger" data-cmd="quit" data-hold="1">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><path d="M12 2v10"/></svg></div>
          <div><div class="label">Quit app</div><div class="hint">Hold to confirm</div></div>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var TOKEN_KEY = 'pulse-remote-token';
  var params = new URLSearchParams(location.search);
  var token = params.get('t');
  try {
    if (token) localStorage.setItem(TOKEN_KEY, token);
    else token = localStorage.getItem(TOKEN_KEY);
  } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };
  var toastTimer;
  function toast(text, isErr) {
    var el = $('toast');
    el.textContent = text;
    el.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'toast'; }, 1600);
  }
  function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms || 12); }

  function api(method, path, body) {
    return fetch(path, {
      method: method,
      headers: { 'Content-Type': 'application/json', 'X-Remote-Token': token || '' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (res.status === 401) { lock(); throw new Error('Bad token'); }
        if (!res.ok) throw new Error(data.error || ('Error ' + res.status));
        return data;
      });
    });
  }

  function lock() { document.body.classList.add('locked'); }
  function unlock() { document.body.classList.remove('locked'); }
  if (!token) lock();

  $('tokenSave').addEventListener('click', function () {
    var v = $('tokenInput').value.trim();
    if (!v) return;
    token = v;
    try { localStorage.setItem(TOKEN_KEY, v); } catch (e) {}
    unlock();
    poll();
  });

  var LABELS = {
    'screenshot': 'Screenshot queued',
    'quick-send': 'Capturing & asking…',
    'send': 'Sent',
    'clear-screenshots': 'Screenshots cleared',
    'clear-input': 'Input cleared',
    'mic-toggle': 'Mic toggled',
    'toggle-visibility': 'Visibility toggled',
    'toggle-interactive': 'Mouse mode toggled',
    'toggle-minimize': 'Minimize toggled',
    'toggle-fullsize': 'Size toggled',
    'quit': 'App closed'
  };

  function run(cmd, btn) {
    buzz();
    if (btn) {
      btn.classList.remove('flashing');
      void btn.offsetWidth;
      btn.classList.add('flashing');
      setTimeout(function () { btn.classList.remove('flashing'); }, 60);
    }
    api('POST', '/api/command', { command: cmd })
      .then(function () {
        if (LABELS[cmd]) toast(LABELS[cmd]);
        setTimeout(poll, 250);
      })
      .catch(function (err) { toast(err.message, true); buzz([30, 40, 30]); });
  }

  // Wire up every [data-cmd] button. Hold-to-confirm buttons only fire after
  // a 0.9s press; everything else fires on tap.
  Array.prototype.forEach.call(document.querySelectorAll('[data-cmd]'), function (btn) {
    if (btn.classList.contains('btn') && !btn.querySelector('.flash')) {
      var f = document.createElement('span');
      f.className = 'flash';
      btn.appendChild(f);
    }
    var cmd = btn.getAttribute('data-cmd');
    if (btn.hasAttribute('data-hold')) {
      var holdTimer;
      var start = function (e) {
        e.preventDefault();
        btn.classList.add('hold-fill');
        buzz(8);
        holdTimer = setTimeout(function () {
          btn.classList.remove('hold-fill');
          run(cmd, btn);
        }, 900);
      };
      var cancel = function () { clearTimeout(holdTimer); btn.classList.remove('hold-fill'); };
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('mousedown', start);
      ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(function (ev) { btn.addEventListener(ev, cancel); });
    } else {
      btn.addEventListener('click', function (e) {
        var r = btn.getBoundingClientRect();
        btn.style.setProperty('--x', (e.clientX - r.left) + 'px');
        btn.style.setProperty('--y', (e.clientY - r.top) + 'px');
        run(cmd, btn);
      });
    }
  });

  // Composer
  var msg = $('msg');
  var msgSend = $('msgSend');
  function autosize() {
    msg.style.height = 'auto';
    msg.style.height = Math.min(msg.scrollHeight, 160) + 'px';
    msgSend.disabled = !msg.value.trim();
  }
  msg.addEventListener('input', autosize);
  function sendMsg() {
    var text = msg.value.trim();
    if (!text) return;
    buzz();
    msgSend.disabled = true;
    api('POST', '/api/message', { text: text })
      .then(function () { msg.value = ''; autosize(); toast('Message sent'); setTimeout(poll, 250); })
      .catch(function (err) { toast(err.message, true); autosize(); });
  }
  msgSend.addEventListener('click', sendMsg);
  msg.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  });

  // Live state
  function setConn(on) {
    var c = $('conn');
    c.className = 'conn' + (on ? ' on' : '');
    c.querySelector('span').textContent = on ? 'Connected' : 'Offline';
  }

  function chip(text, cls) { return '<span class="chip ' + (cls || '') + '">' + text + '</span>'; }

  var lastReplyText = null;
  function render(s) {
    var o = s.overlay || {};
    var r = s.renderer || {};
    var chips = '';
    chips += chip(o.visible ? 'Visible' : 'Hidden', o.visible ? 'lit' : '');
    chips += chip(o.interactive ? 'Clickable' : 'Click-through', o.interactive ? 'lit' : '');
    if (o.minimized) chips += chip('Minimized', 'lit');
    if (o.fullSize) chips += chip('Full size', 'lit');
    if (r.pendingScreenshots) chips += chip(r.pendingScreenshots + ' screenshot' + (r.pendingScreenshots > 1 ? 's' : '') + ' queued', 'lit');
    if (r.sending) chips += chip('Thinking…', 'lit');
    if (r.micRecording) chips += chip('Listening', 'rec');
    $('chips').innerHTML = chips;

    var badge = $('shotBadge');
    badge.textContent = r.pendingScreenshots || 0;
    badge.classList.toggle('show', !!r.pendingScreenshots);

    $('micBtn').classList.toggle('recording', !!r.micRecording);
    $('micLabel').textContent = r.micRecording ? 'Stop & transcribe' : 'Dictate';
    $('visLabel').textContent = o.visible ? 'Hide' : 'Show';
    $('visBtn').classList.toggle('on', !!o.visible);
    $('intLabel').textContent = o.interactive ? 'Clickable' : 'Click-through';
    $('intBtn').classList.toggle('on', !!o.interactive);
    $('minLabel').textContent = o.minimized ? 'Restore' : 'Minimize';
    $('minBtn').classList.toggle('on', !!o.minimized);
    $('fullLabel').textContent = o.fullSize ? 'Normal size' : 'Full size';
    $('fullBtn').classList.toggle('on', !!o.fullSize);

    var reply = $('reply');
    var lr = s.lastReply;
    var key = lr ? (lr.text + '|' + lr.streaming + '|' + lr.error) : '';
    if (key !== lastReplyText) {
      lastReplyText = key;
      var atBottom = reply.scrollHeight - reply.scrollTop - reply.clientHeight < 40;
      if (!lr) {
        reply.className = 'reply empty';
        reply.textContent = 'No replies yet — tap Capture & Ask.';
      } else {
        reply.className = 'reply' + (lr.error ? ' err' : '');
        reply.textContent = lr.text || (lr.streaming ? '' : '(empty reply)');
        if (lr.error) reply.textContent += (lr.text ? '\n\n' : '') + '⚠ ' + lr.error;
        if (lr.streaming) {
          var cur = document.createElement('span');
          cur.className = 'cursor';
          reply.appendChild(cur);
        }
        if (atBottom) reply.scrollTop = reply.scrollHeight;
      }
    }
  }

  var polling = false;
  function poll() {
    if (!token || polling) return;
    polling = true;
    api('GET', '/api/state')
      .then(function (data) { setConn(true); unlock(); render(data.state || {}); })
      .catch(function () { setConn(false); })
      .then(function () { polling = false; });
  }

  poll();
  setInterval(function () { if (!document.hidden) poll(); }, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
})();
</script>
</body>
</html>
